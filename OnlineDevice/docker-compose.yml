services:
  esp-idf:
    image: espressif/idf:release-v6.1
    container_name: esp-idf-builder
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /project
    volumes:
      - .:/project
      - /dev:/dev          # 直通宿主机串口节点（ttyUSB0/ttyACM0 枚举变化都不用改本文件）
    group_add:
      - dialout            # 镜像内 dialout=gid 20，容器默认无附加组
    environment:
      - HOME=/tmp
    tty: true
    stdin_open: true
